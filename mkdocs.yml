site_name: LIWH.DEV
site_author: Li
site_description: Li 的技术博客，记录 Go 运行时、区块链应用与系统架构实践。
site_url: https://liwh1227.github.io/
repo_url: https://github.com/liwh1227/liwh1227.github.io
repo_name: liwh1227

theme:
  name: material
  language: zh
  custom_dir: overrides
  icon:
    logo: material/code-braces
  features:
    - navigation.tabs        # 顶部导航
    - navigation.instant     # 类似 SPA 的无刷新跳转
    - navigation.tracking    # URL 随滚动变化
    - toc.follow             # 侧边栏跟随
    - content.code.copy

  palette:
    # 明亮模式 (Light Mode)
    - scheme: default
      primary: white         # 实际上会被 CSS 覆盖
      accent: black
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式

    # 暗黑模式 (Dark Mode)
    - scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

  # 使用系统字体，避免外部字体请求影响首屏加载。
  font: false

# 4. 引入自定义 CSS (这是实现黑白风格的关键)
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/text-mml-svg.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
        generic: true
  - footnotes

plugins:
  - search:
      # 保留代码术语的完整拼写，避免 tinycache 等词被词干化后漏检。
      pipeline: []
  - awesome-pages
  - glightbox

hooks:
  - hooks/reading_time.py
